          B64
          n=0; bad=0
          while IFS= read -r l; do
            n=$((n+1)); c="${l%% *}"; p="${l#* }"
            [ "$(printf %s "$p" | md5sum | cut -c1-4)" = "$c" ] || { echo "ҚАТЕ: $n-жол дұрыс көшірілмеген" >&2; bad=1; }
            printf %s "$p"
          done < data.txt > b64.txt
          [ "$bad" = 0 ] || exit 1
          base64 -d b64.txt | tar xJ

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk Crosshair.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Crosshair build ${{ github.run_number }}
          files: Crosshair.apk
