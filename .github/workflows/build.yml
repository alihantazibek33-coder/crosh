name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Find project folder
        id: p
        run: echo "dir=$(dirname "$(find . -name settings.gradle | head -n1)")" >> $GITHUB_OUTPUT

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$(find . -name app-debug.apk | head -n1)" Crosshair.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Crosshair build ${{ github.run_number }}
          files: Crosshair.apk
