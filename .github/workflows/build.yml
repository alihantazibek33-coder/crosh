name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Create project files
        run: |
          mkdir -p proj && cd proj
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.crosshair'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.crosshair"
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Прицел"
                  android:icon="@android:drawable/ic_menu_mylocation">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" />
              </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/crosshair/CrosshairView.java)
          cat > app/src/main/java/com/example/crosshair/CrosshairView.java <<'EOF'
          package com.example.crosshair;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.view.View;

          public class CrosshairView extends View {
              public static final int TYPES = 5;
              private int type = 1, color = Color.RED;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final float d;

              public CrosshairView(Context c) {
                  super(c);
                  d = c.getResources().getDisplayMetrics().density;
              }

              public void set(int t, int col) { type = t; color = col; invalidate(); }

              @Override
              protected void onMeasure(int w, int h) {
                  int s = (int) (120 * d);
                  setMeasuredDimension(s, s);
              }

              @Override
              protected void onDraw(Canvas c) {
                  float cx = getWidth() / 2f, cy = getHeight() / 2f;
                  float g = 6 * d, l = 28 * d, r = 30 * d;
                  p.setColor(color);
                  p.setStrokeWidth(2 * d);
                  switch (type) {
                      case 0: // нүкте
                          p.setStyle(Paint.Style.FILL);
                          c.drawCircle(cx, cy, 4 * d, p);
                          break;
                      case 1: // крест (ортасы бос)
                          c.drawLine(cx - l, cy, cx - g, cy, p);
                          c.drawLine(cx + g, cy, cx + l, cy, p);
                          c.drawLine(cx, cy - l, cx, cy - g, p);
                          c.drawLine(cx, cy + g, cx, cy + l, p);
                          break;
                      case 2: // шеңбер
                          p.setStyle(Paint.Style.STROKE);
                          c.drawCircle(cx, cy, r, p);
                          break;
                      case 3: // шеңбер + нүкте
                          p.setStyle(Paint.Style.STROKE);
                          c.drawCircle(cx, cy, r, p);
                          p.setStyle(Paint.Style.FILL);
                          c.drawCircle(cx, cy, 3 * d, p);
                          break;
                      case 4: // X
                          c.drawLine(cx - l, cy - l, cx - g, cy - g, p);
                          c.drawLine(cx + g, cy + g, cx + l, cy + l, p);
                          c.drawLine(cx + l, cy - l, cx + g, cy - g, p);
                          c.drawLine(cx - g, cy + g, cx - l, cy + l, p);
                          break;
                  }
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/crosshair/MainActivity.java)
          cat > app/src/main/java/com/example/crosshair/MainActivity.java <<'EOF'
          package com.example.crosshair;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this);
                  l.setGravity(Gravity.CENTER);
                  Button btn = new Button(this);
                  btn.setText("Прицелді қосу");
                  l.addView(btn);
                  setContentView(l);

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  btn.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Басқа қолданбалардың үстінен көрсетуге рұқсат беріңіз", Toast.LENGTH_LONG).show();
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                          return;
                      }
                      startForegroundService(new Intent(this, OverlayService.class));
                      finish();
                  });
              }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/crosshair/OverlayService.java)
          cat > app/src/main/java/com/example/crosshair/OverlayService.java <<'EOF'
          package com.example.crosshair;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class OverlayService extends Service {
              static final String ACTION_MOVE = "com.example.crosshair.MOVE";
              static final String ACTION_STOP = "com.example.crosshair.STOP";
              static final String CH = "crosshair";
              static final int[] COLORS = {Color.RED, Color.GREEN, Color.CYAN, Color.YELLOW, Color.WHITE};

              WindowManager wm;
              NotificationManager nm;
              SharedPreferences sp;
              CrosshairView cross;
              WindowManager.LayoutParams cp, mp;
              View menu;
              TextView stepLabel;
              boolean menuShown = false;
              int step = 5, type, color;

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CH, "Прицел", NotificationManager.IMPORTANCE_LOW));
                  sp = getSharedPreferences("c", MODE_PRIVATE);
                  type = sp.getInt("type", 1);
                  color = sp.getInt("color", Color.RED);

                  cross = new CrosshairView(this);
                  cross.set(type, color);
                  cp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  cp.gravity = Gravity.CENTER;
                  cp.x = sp.getInt("x", 0);
                  cp.y = sp.getInt("y", 0);
                  wm.addView(cross, cp);

                  // қолмен сүйреу (тек жылжыту режимінде жұмыс істейді)
                  cross.setOnTouchListener(new View.OnTouchListener() {
                      float dx, dy; int sx, sy;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  dx = e.getRawX(); dy = e.getRawY(); sx = cp.x; sy = cp.y; return true;
                              case MotionEvent.ACTION_MOVE:
                                  cp.x = sx + (int) (e.getRawX() - dx);
                                  cp.y = sy + (int) (e.getRawY() - dy);
                                  wm.updateViewLayout(cross, cp);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  savePos(); return true;
                          }
                          return false;
                      }
                  });
                  buildMenu();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForeground(1, buildNotification());
                  String a = intent == null ? null : intent.getAction();
                  if (ACTION_STOP.equals(a)) {
                      stopForeground(true);
                      stopSelf();
                  } else if (ACTION_MOVE.equals(a)) {
                      toggleMenu();
                  }
                  return START_STICKY;
              }

              // ---------- Хабарлама ----------
              Notification buildNotification() {
                  PendingIntent mv = PendingIntent.getService(this, 1,
                          new Intent(this, OverlayService.class).setAction(ACTION_MOVE),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  PendingIntent st = PendingIntent.getService(this, 2,
                          new Intent(this, OverlayService.class).setAction(ACTION_STOP),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Builder(this, CH)
                          .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                          .setContentTitle("Прицел қосулы")
                          .setOngoing(true)
                          .addAction(android.R.drawable.ic_menu_edit, menuShown ? "Жылжытуды жабу" : "Жылжыту", mv)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Өшіру", st)
                          .build();
              }

              // ---------- Меню ----------
              void toggleMenu() {
                  menuShown = !menuShown;
                  if (menuShown) {
                      wm.addView(menu, mp);
                      cp.flags &= ~WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE;
                  } else {
                      wm.removeView(menu);
                      cp.flags |= WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE;
                  }
                  wm.updateViewLayout(cross, cp);
                  nm.notify(1, buildNotification()); // батырма мәтінін жаңарту
              }

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              Button btn(String t, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(t);
                  b.setAllCaps(false);
                  b.setMinWidth(0); b.setMinimumWidth(0);
                  b.setOnClickListener(l);
                  return b;
              }

              LinearLayout row() {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER);
                  return r;
              }

              void buildMenu() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(10), dp(6), dp(10), dp(10));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xEE222222);
                  bg.setCornerRadius(dp(14));
                  root.setBackground(bg);

                  mp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  mp.gravity = Gravity.TOP | Gravity.START;
                  mp.x = dp(16); mp.y = dp(120);

                  // меню тақырыбы: осыдан сүйреп менюді жылжытуға болады
                  TextView title = new TextView(this);
                  title.setText("✥ Прицел (осыдан сүйреңіз)");
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(6), 0, dp(6));
                  title.setOnTouchListener(new View.OnTouchListener() {
                      float dx, dy; int sx, sy;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  dx = e.getRawX(); dy = e.getRawY(); sx = mp.x; sy = mp.y; return true;
                              case MotionEvent.ACTION_MOVE:
                                  mp.x = sx + (int) (e.getRawX() - dx);
                                  mp.y = sy + (int) (e.getRawY() - dy);
                                  wm.updateViewLayout(menu, mp);
                                  return true;
                          }
                          return false;
                      }
                  });
                  root.addView(title);

                  // түрі
                  LinearLayout r1 = row();
                  r1.addView(btn("◀ Түрі", v -> { type = (type + CrosshairView.TYPES - 1) % CrosshairView.TYPES; apply(); }));
                  r1.addView(btn("Түрі ▶", v -> { type = (type + 1) % CrosshairView.TYPES; apply(); }));
                  root.addView(r1);

                  // түсі
                  LinearLayout r2 = row();
                  for (int c : COLORS) {
                      Button b = btn("", v -> { color = c; apply(); });
                      b.setBackgroundColor(c);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(40), dp(40));
                      lp.setMargins(dp(3), dp(6), dp(3), dp(6));
                      r2.addView(b, lp);
                  }
                  root.addView(r2);

                  // қадам
                  stepLabel = new TextView(this);
                  stepLabel.setTextColor(Color.WHITE);
                  stepLabel.setGravity(Gravity.CENTER);
                  stepLabel.setText("Қадам: " + step + " px");
                  root.addView(stepLabel);
                  LinearLayout r3 = row();
                  for (int s : new int[]{1, 5, 10, 25}) {
                      r3.addView(btn(String.valueOf(s), v -> { step = s; stepLabel.setText("Қадам: " + step + " px"); }));
                  }
                  root.addView(r3);

                  // бағыттар
                  LinearLayout up = row();
                  up.addView(btn("▲", v -> move(0, -step)));
                  LinearLayout mid = row();
                  mid.addView(btn("◀", v -> move(-step, 0)));
                  mid.addView(btn("▼", v -> move(0, step)));
                  mid.addView(btn("▶", v -> move(step, 0)));
                  root.addView(up);
                  root.addView(mid);

                  root.addView(btn("Орталыққа қайтару", v -> { cp.x = 0; cp.y = 0; wm.updateViewLayout(cross, cp); savePos(); }));
                  menu = root;
              }

              void move(int dx, int dy) {
                  cp.x += dx; cp.y += dy;
                  wm.updateViewLayout(cross, cp);
                  savePos();
              }

              void apply() {
                  cross.set(type, color);
                  sp.edit().putInt("type", type).putInt("color", color).apply();
              }

              void savePos() { sp.edit().putInt("x", cp.x).putInt("y", cp.y).apply(); }

              @Override
              public void onDestroy() {
                  try { wm.removeView(cross); } catch (Exception ignored) {}
                  if (menuShown) { try { wm.removeView(menu); } catch (Exception ignored) {} }
                  super.onDestroy();
              }
          }
          EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.0' apply false }
          EOF
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CrosshairApp"
          include ':app'
          EOF

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk Crosshair.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Crosshair build ${{ github.run_number }}
          files: Crosshair.apk
