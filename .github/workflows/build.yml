          mkdir -p $(dirname app/src/main/java/com/example/crosshair/WidgetService.java)
          cat > app/src/main/java/com/example/crosshair/WidgetService.java <<'EOF'
          package com.example.crosshair;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.net.TrafficStats;
          import android.os.BatteryManager;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class WidgetService extends Service {
              static final String ACTION_STOP = "com.example.crosshair.WSTOP";
              static final String ACTION_REFRESH = "com.example.crosshair.WREFRESH";
              static final String CH = "widgets";
              static boolean running = false;

              WindowManager wm;
              NotificationManager nm;
              SharedPreferences sp;
              LinearLayout panel;
              TextView tClock, tBatt, tNet;
              final Handler h = new Handler(Looper.getMainLooper());
              long lastRx, lastTx, lastT;
              final SimpleDateFormat fmt = new SimpleDateFormat("HH:mm:ss", Locale.getDefault());

              final Runnable tick = new Runnable() {
                  @Override public void run() {
                      update();
                      h.postDelayed(this, 1000);
                  }
              };

              @Override public IBinder onBind(Intent i) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  running = true;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CH, "Виджеттер", NotificationManager.IMPORTANCE_LOW));
                  sp = getSharedPreferences("c", MODE_PRIVATE);
                  lastRx = TrafficStats.getTotalRxBytes();
                  lastTx = TrafficStats.getTotalTxBytes();
                  lastT = SystemClock.elapsedRealtime();
                  build();
                  h.post(tick);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForeground(2, buildNotification());
                  String a = intent == null ? null : intent.getAction();
                  if (ACTION_STOP.equals(a)) {
                      stopForeground(true);
                      stopSelf();
                  } else if (ACTION_REFRESH.equals(a)) {
                      build();
                      update();
                  }
                  return START_STICKY;
              }

              Notification buildNotification() {
                  PendingIntent st = PendingIntent.getService(this, 20,
                          new Intent(this, WidgetService.class).setAction(ACTION_STOP),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Builder(this, CH)
                          .setSmallIcon(android.R.drawable.ic_menu_info_details)
                          .setContentTitle("Виджеттер қосулы")
                          .setOngoing(true)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Өшіру", st)
                          .build();
              }

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              TextView tv(int sizeSp) {
                  TextView t = new TextView(this);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sizeSp);
                  t.setTypeface(android.graphics.Typeface.MONOSPACE);
                  return t;
              }

              void build() {
                  if (panel != null) {
                      try { wm.removeView(panel); } catch (Exception ignored) {}
                  }
                  int sz = sp.getInt("w_size", 13);
                  int pos = sp.getInt("w_pos", 1);

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(dp(8), dp(4), dp(8), dp(4));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0x99000000);
                  bg.setCornerRadius(dp(8));
                  panel.setBackground(bg);

                  tClock = null; tBatt = null; tNet = null;
                  if (sp.getBoolean("w_clock", true)) { tClock = tv(sz); panel.addView(tClock); }
                  if (sp.getBoolean("w_batt", true)) { tBatt = tv(sz); panel.addView(tBatt); }
                  if (sp.getBoolean("w_net", true)) { tNet = tv(sz); panel.addView(tNet); }

                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                          PixelFormat.TRANSLUCENT);
                  int[] g = {Gravity.TOP | Gravity.START, Gravity.TOP | Gravity.END,
                          Gravity.BOTTOM | Gravity.START, Gravity.BOTTOM | Gravity.END};
                  lp.gravity = g[pos % 4];
                  lp.x = dp(8);
                  lp.y = (pos < 2) ? dp(30) : dp(40);
                  wm.addView(panel, lp);
              }

              String speed(float bps) {
                  if (bps >= 1024 * 1024) return String.format(Locale.US, "%.1f MB/s", bps / 1048576f);
                  return String.format(Locale.US, "%.0f KB/s", bps / 1024f);
              }

              void update() {
                  if (tClock != null) tClock.setText("🕒 " + fmt.format(new Date()));

                  if (tBatt != null) {
                      Intent b = registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      if (b != null) {
                          int level = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                          int scale = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                          int status = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                          float temp = b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) / 10f;
                          boolean ch = status == BatteryManager.BATTERY_STATUS_CHARGING
                                  || status == BatteryManager.BATTERY_STATUS_FULL;
                          int pct = scale > 0 ? level * 100 / scale : level;
                          tBatt.setText("🔋 " + pct + "%" + (ch ? " ⚡" : "") + " " + String.format(Locale.US, "%.0f°C", temp));
                      }
                  }

                  long now = SystemClock.elapsedRealtime();
                  long rx = TrafficStats.getTotalRxBytes();
                  long tx = TrafficStats.getTotalTxBytes();
                  float dt = (now - lastT) / 1000f;
                  if (tNet != null && dt > 0 && rx != TrafficStats.UNSUPPORTED && tx != TrafficStats.UNSUPPORTED) {
                      tNet.setText("⬇ " + speed((rx - lastRx) / dt) + "\n⬆ " + speed((tx - lastTx) / dt));
                  }
                  lastRx = rx; lastTx = tx; lastT = now;
              }

              @Override
              public void onDestroy() {
                  running = false;
                  h.removeCallbacks(tick);
                  if (panel != null) {
                      try { wm.removeView(panel); } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }
          }
